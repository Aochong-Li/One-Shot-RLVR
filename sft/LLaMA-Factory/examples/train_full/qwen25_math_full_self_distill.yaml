### model
model_name_or_path: Qwen/Qwen2.5-Math-1.5B

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_offload_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset_dir: ./data
dataset: DeepMath-Hard-4096-GRPO-1800-steps
template: qwen25_math
cutoff_len: 4096
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: ./outputs/llamafactory-sft/Qwen2.5-Math-1.5B-DeepMath-Hard-GRPO-1800-steps-SFT
logging_steps: 1
save_steps: 1390
plot_loss: true

### train
# Effective batch size = per_device_train_batch_size * gradient_accumulation_steps * num_gpus = 8 * 2 * 8 = 128
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
bf16: true
ddp_timeout: 180000000

report_to: wandb
run_name: Qwen2.5-Math-1.5B-DeepMath-Hard-GRPO-1800-steps-SFT

