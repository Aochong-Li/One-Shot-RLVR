hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}

actor_rollout_ref:
  actor:
    use_kl_loss: False
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    clip_ratio_c: 3.0
    loss_agg_mode: "token-mean"

reward_model:
  reward_manager: dapo
  overlong_buffer: 
    enable: True
    len: 1024
    penalty_factor: 1.0
    log: True